<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 밥상</title>
<style>
  :root {
    --bg: #f6ead8;          /* 한지 */
    --bg-dot: #ead8bd;
    --ink: #4a2e1f;         /* 먹색 갈색 */
    --ink-soft: #8a6a52;
    --table: #9c5b32;       /* 소반 나무색 */
    --table-dark: #6e3b1d;
    --table-light: #b8743f;
    --card: #fffaf1;
    --accent: #b8332a;      /* 고춧가루 빨강 */
    --shadow: rgba(74, 46, 31, .25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(var(--bg-dot) 1px, transparent 1px) 0 0 / 18px 18px,
      var(--bg);
    color: var(--ink);
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", "Malgun Gothic", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 56px;
  }

  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 2.8rem);
    letter-spacing: .12em;
  }
  header h1::after {
    content: "";
    display: block;
    width: 48px;
    height: 4px;
    margin: 12px auto 0;
    border-radius: 2px;
    background: var(--accent);
  }
  header p { margin: 12px 0 0; color: var(--ink-soft); }

  /* ── 둥근 상 ── */
  .table {
    width: min(92vw, 600px);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,
        transparent 0 14px, rgba(0,0,0,.05) 14px 15px),
      radial-gradient(circle at 35% 30%, var(--table-light), var(--table) 55%, var(--table-dark));
    border: 12px solid var(--table-dark);
    box-shadow:
      inset 0 0 0 4px rgba(255,255,255,.12),
      inset 0 -10px 30px rgba(0,0,0,.25),
      0 24px 40px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 12%;
  }

  /* ── 밥 · 국 · 김치 카드 ── */
  .main {
    display: flex;
    gap: 14px;
    justify-content: center;
  }
  .card {
    width: clamp(78px, 20vw, 120px);
    aspect-ratio: 3 / 4;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 6px 12px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .2s;
  }
  .card:hover { transform: translateY(-4px) rotate(-2deg); }
  .card .emoji { font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1; }
  .card .name  { font-weight: 700; font-size: clamp(.9rem, 3vw, 1.1rem); }

  /* ── 반찬 목록: <li> 한 줄 = 반찬 하나 ── */
  .banchan {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 100%;
  }
  .banchan li {
    background: var(--card);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: clamp(.8rem, 2.6vw, .95rem);
    box-shadow: 0 3px 6px rgba(0,0,0,.2);
    white-space: nowrap;
  }

  footer { margin-top: 28px; color: var(--ink-soft); font-size: .9rem; }
</style>
</head>
<body>

  <header>
    <h1>오늘의 밥상</h1>
    <p>따뜻한 한 끼, 잘 먹겠습니다</p>
  </header>

  <main class="table">
    <div class="main">
      <div class="card"><span class="emoji">🍚</span><span class="name">밥</span></div>
      <div class="card"><span class="emoji">🍲</span><span class="name">국</span></div>
      <div class="card"><span class="emoji">🥬</span><span class="name">김치</span></div>
    </div>

    <!-- 반찬: 아래에 <li>이모지 이름</li> 한 줄씩 추가하세요 -->
    <ul class="banchan">
      <li>🥚 계란말이</li>
      <li>🐟 고등어구이</li>
      <li>🌱 콩나물무침</li>
      <li>🥔 감자조림</li>
      <li>🍖 돈까스</li>
    </ul>
  </main>

  <footer>잘 먹었습니다 🙏</footer>

</body>
</html>
